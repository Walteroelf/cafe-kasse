<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Café-Kasse">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4DB2E6">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Café-Kasse</title>
<link rel="stylesheet" href="design.css?v=3">
<style>
  /* Gemeinsames Design der Unterrichts-Apps (Olympia 72), Regeln in DESIGN.md.
     Hier nur, was die Café-Kasse zusätzlich braucht. Das Spielgeld (geld.js) behält seine Euro-Farben. */
  @font-face { font-family: "Andika"; font-weight: 400; font-display: swap; src: url("schriften/andika-400.woff2") format("woff2"); }
  @font-face { font-family: "Andika"; font-weight: 700; font-display: swap; src: url("schriften/andika-700.woff2") format("woff2"); }

  :root {
    --bg: var(--hg); --card: var(--karte); --ink: var(--text); --muted: var(--leise); --line: var(--linie);
    --gut-text: var(--gruen-schrift);
    --anzeige: var(--schrift);
  }
  * { -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-size: 20px;
    background: var(--bg); color: var(--ink);
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
    display: flex; flex-direction: column; overflow: hidden;
    padding-top: env(safe-area-inset-top);
  }
  button { border: 0; }
  button:disabled { opacity: .45; cursor: default; }
  .hidden { display: none !important; }
  svg.symbol { display: inline-block; }

  /* Farbband wie in den anderen Apps */
  .band { display: flex; height: 12px; flex: none; }
  .band i { flex: 1; }
  .band i:nth-child(1){ background: var(--hellblau); } .band i:nth-child(2){ background: var(--blau); } .band i:nth-child(3){ background: var(--gruen); } .band i:nth-child(4){ background: var(--hellgruen); }
  .band i:nth-child(5){ background: var(--gelb); } .band i:nth-child(6){ background: var(--orange); } .band i:nth-child(7){ background: var(--silber); }

  /* ---------- Kopfzeile ---------- */
  header {
    display: flex; align-items: center; gap: 16px; padding: 8px 16px;
    background: var(--card); border-bottom: var(--rand-breite) solid var(--line); min-height: 72px;
  }
  header h1 { font-size: var(--gr-3); margin: 0; font-weight: 700; }
  .homebtn {
    display: flex; align-items: center; gap: 10px; padding: 0 22px 0 16px; min-height: var(--knopf-hoehe); border-radius: var(--rundung);
    background: var(--card); color: var(--text); border: var(--rand-breite) solid var(--rand); font-weight: 700; font-size: var(--gr-2);
  }
  .homebtn:active { background: var(--auswahl); }

  /* ---------- Knöpfe ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: var(--knopf-hoehe); padding: 0 30px; border-radius: var(--rundung); font-size: var(--gr-3); font-weight: 700;
    background: var(--card); color: var(--text); border: var(--rand-breite) solid var(--rand);
  }
  .btn:active:not(:disabled) { transform: translateY(2px); }
  .btn.gruen { background: var(--gruen); border-color: var(--gruen); color: var(--dunkelblau); }
  .btn.blau { background: var(--hellblau); border-color: var(--hellblau); color: var(--dunkelblau); }
  .btn.gelb { background: var(--gelb); border-color: var(--gelb); color: var(--dunkelblau); }
  .btn.gross { font-size: var(--gr-4); min-height: 76px; padding: 0 44px; }

  /* Vollbild-Knopf */
  .fsbtn { display: flex; align-items: center; gap: 10px; padding: 0 18px; min-height: var(--knopf-hoehe); border-radius: var(--rundung); background: var(--card); color: var(--text); border: var(--rand-breite) solid var(--rand); font-weight: 700; font-size: var(--gr-1); }
  .fsbtn:active { background: var(--auswahl); }
  .fsbtn svg { width: 28px; height: 28px; }
  .fsbtn .i-aus { display: none; }
  body.ist-vollbild .fsbtn .i-an { display: none; }
  body.ist-vollbild .fsbtn .i-aus { display: block; }
  .start-fs { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 16px; z-index: 2; }
  #sStart { position: relative; }
  .fsbtn.hidden { display: none !important; }
  @media (max-width: 700px) { .fsbtn span { display: none; } }

  /* ---------- Startbildschirm ---------- */
  #sStart { flex: 1; display: flex; flex-direction: column; padding: 22px; gap: 22px; overflow-y: auto; }
  .start-titel { text-align: center; font-size: clamp(34px, 5vw, 52px); font-weight: 700; margin: 6px 0 0; display: flex; align-items: center; justify-content: center; gap: 16px; }
  .start-titel .symbol { width: 1em; height: 1em; }
  .start-frage { text-align: center; font-size: var(--gr-2); color: var(--muted); margin: -10px 0 0; }
  .start-karten { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; min-height: min-content; }
  .start-karte {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    border-radius: var(--rundung-gross); padding: 24px; text-align: center; color: var(--dunkelblau);
  }
  .start-karte:active { transform: translateY(3px); }
  .start-karte svg { width: min(260px, 40vh); height: auto; }
  .start-karte b { font-size: clamp(38px, 5.5vw, 60px); font-weight: 700; line-height: 1.05; }
  .start-karte span { font-size: var(--gr-2); }
  .start-karte.kasse { background: var(--hellblau); }
  .start-karte.artikel { background: var(--gelb); }
  @media (max-width: 700px) { .start-karten { grid-template-columns: 1fr; } .start-karte svg { width: min(160px, 22vh); } }

  /* ---------- Kasse ---------- */
  #sKasse { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #kasseMain { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .tile {
    position: relative; background: var(--card); border-radius: var(--rundung-gross); overflow: hidden; display: block; width: 100%;
    text-align: left; padding: 0; border: 4px solid var(--rand); color: var(--text);
  }
  .tile:active { transform: scale(.97); }
  .tile .ph { width: 100%; aspect-ratio: 4/3; background: var(--flaeche-2) center/cover no-repeat; display: flex; align-items: center; justify-content: center; color: var(--leise); }
  .tile .ph svg { width: 56px; height: 56px; }
  .tile .info { padding: 10px 14px 14px; }
  .tile .name { font-weight: 700; font-size: var(--gr-2); line-height: 1.15; }
  .tile .price { display: inline-block; margin-top: 6px; background: var(--gelb); color: var(--dunkelblau); border-radius: 10px; padding: 2px 12px; font-weight: 700; font-size: var(--gr-2); }
  .tile.sel { border-color: var(--gruen); }
  .badge {
    position: absolute; top: 10px; right: 10px; min-width: 56px; height: 56px; padding: 0 14px; border-radius: 28px;
    background: var(--gruen); color: var(--dunkelblau); border: 3px solid var(--dunkelblau); font-weight: 700; font-size: var(--gr-3);
    display: flex; align-items: center; justify-content: center;
  }
  .minus {
    position: absolute; top: 10px; left: 10px; width: 56px; height: 56px; border-radius: 28px;
    background: var(--weiss); color: var(--dunkelblau); border: 3px solid var(--dunkelblau); display: flex; align-items: center; justify-content: center;
  }
  .minus .symbol { width: 28px; height: 28px; }
  .empty { text-align: center; color: var(--muted); margin: 60px auto 0; font-size: var(--gr-2); line-height: 1.5; max-width: 520px; }
  #bar {
    display: flex; align-items: center; gap: 16px; padding: 14px 18px; padding-bottom: calc(14px + env(safe-area-inset-bottom));
    background: var(--card); border-top: var(--rand-breite) solid var(--line);
  }
  #total { margin-right: auto; font-weight: 700; font-size: 54px; font-variant-numeric: tabular-nums; line-height: 1; }
  #total small { display: block; font-weight: 400; font-size: var(--gr-1); color: var(--muted); margin-bottom: 4px; }

  /* ---------- Overlay ---------- */
  .overlay { position: fixed; inset: 0; background: var(--bg); z-index: 10; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }
  .overlay-head { display: flex; align-items: center; gap: 18px; padding: 8px 16px; background: var(--card); border-bottom: var(--rand-breite) solid var(--line); min-height: 72px; }
  .overlay-head h2 { font-size: var(--gr-3); margin: 0; font-weight: 700; }
  .overlay .actions {
    display: flex; gap: 14px; padding: 14px 18px; padding-bottom: calc(14px + env(safe-area-inset-bottom));
    background: var(--card); border-top: var(--rand-breite) solid var(--line);
  }
  .overlay .actions .gruen { margin-left: auto; }

  /* ---------- Bezahlen ---------- */
  .pay-grid { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 18px; width: 100%; max-width: 960px; margin: 0 auto; }
  .kosten {
    background: var(--gelb); color: var(--dunkelblau); border-radius: var(--rundung-gross); padding: 14px 22px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  }
  .kosten span { font-size: var(--gr-2); font-weight: 700; }
  .kosten b { font-size: 64px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .teller {
    flex: 1; min-height: 0; background: var(--card); border: 4px dashed var(--rand); border-radius: var(--rundung-gross); padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .teller-t { font-size: var(--gr-2); font-weight: 700; color: var(--akzent-text); }
  .teller-inhalt { flex: 1; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; align-items: center; }
  .teller-leer { color: var(--muted); font-size: var(--gr-1); padding: 14px 6px; }
  .teller-inhalt button { background: none; padding: 3px; border-radius: 12px; line-height: 0; }
  .teller-inhalt button:active { transform: scale(.92); opacity: .6; }
  .teller-hinweis { font-size: 18px; color: var(--muted); }
  .teller-summe { font-size: var(--gr-2); font-weight: 700; display: flex; justify-content: space-between; border-top: var(--rand-breite) solid var(--line); padding-top: 10px; }
  .teller-summe b { font-size: var(--gr-4); font-weight: 700; }
  .status { border-radius: var(--rundung); padding: 14px 20px; font-weight: 700; font-size: var(--gr-3); display: flex; align-items: center; gap: 14px; min-height: 76px; color: var(--dunkelblau); }
  .status.fehlt { background: var(--orange); }
  .status.genug { background: var(--gruen); }
  .status.leer { background: var(--flaeche-2); color: var(--muted); font-weight: 400; }
  .status svg { width: 38px; height: 38px; flex: none; }

  .vorrat-reihe { display: flex; flex-wrap: wrap; gap: 12px 14px; align-items: center; }
  .vorrat-reihe.muenzen { gap: 12px 18px; }
  .vorrat-reihe button { background: none; padding: 4px; border-radius: 14px; line-height: 0; color: inherit; }
  .vorrat-reihe button:active { transform: scale(.92); background: var(--auswahl); }
  .vorrat-titel { font-size: var(--gr-1); color: var(--muted); margin: 0 0 -4px; font-weight: 700; }
  .geldbild svg { display: block; max-width: 100%; height: auto; }
  /* Bezahl-Ansicht: Kauf-Artikel + Gesamtbetrag */
  .bill-body { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 14px; align-items: center; -webkit-overflow-scrolling: touch; }
  .bill-items { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; max-width: 1000px; }
  .bcard { width: 170px; background: var(--card); border-radius: var(--rundung); overflow: hidden; border: 3px solid var(--line); text-align: center; }
  .bph { width: 100%; aspect-ratio: 4/3; background: var(--flaeche-2) center/cover no-repeat; display: flex; align-items: center; justify-content: center; color: var(--leise); }
  .bph svg { width: 44px; height: 44px; }
  .bname { font-weight: 700; font-size: 21px; padding: 8px 8px 0; line-height: 1.15; }
  .bprice { font-size: var(--gr-1); color: var(--muted); padding: 2px 8px 10px; }
  .bill-items.klein { gap: 8px; }
  .bill-items.klein .bcard { width: 78px; border-radius: 12px; }
  .bill-items.klein .bname, .bill-items.klein .bprice { display: none; }
  .bill-items.klein .bph svg { width: 28px; height: 28px; }
  .bill-total { background: var(--gelb); color: var(--dunkelblau); border-radius: var(--rundung-gross); padding: 12px 30px; display: flex; align-items: baseline; gap: 22px; }
  .bill-total span { font-size: var(--gr-3); font-weight: 700; }
  .bill-total b { font-size: 60px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .popup-sub { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 24px; background: var(--gelb); color: var(--dunkelblau); font-size: var(--gr-2); font-weight: 700; }
  .popup-sub b { font-size: var(--gr-3); font-weight: 700; }
  .popup-sub .st { font-weight: 700; font-size: var(--gr-2); padding: 6px 16px; border-radius: 14px; display: inline-flex; align-items: center; gap: 8px; }
  .popup-sub .st.fehlt { background: var(--orange); }
  .popup-sub .st.genug { background: var(--gruen); }
  .popup-fotos { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 22px; background: var(--flaeche-2); max-height: 96px; overflow-y: auto; }
  .mini { width: 64px; height: 48px; border-radius: 8px; background: var(--card) center/cover no-repeat; display: flex; align-items: center; justify-content: center; color: var(--leise); border: 2px solid var(--line); flex: none; }
  .mini svg { width: 24px; height: 24px; }
  .popup-x { width: 56px; height: 56px; border-radius: 28px; background: var(--weiss); color: var(--dunkelblau); border: 3px solid var(--dunkelblau); display: flex; align-items: center; justify-content: center; flex: none; }
  .popup-x .symbol { width: 28px; height: 28px; }
  .rueck-gross .rbox.ergebnis b { font-size: 76px; line-height: 1.1; }
  .rueck-gross + .rueck-titel { font-size: var(--gr-3); margin: 0; }
  #changeArea .gruppe { padding: 12px 18px 8px; gap: 4px; }
  #changeArea .gruppe .mal { font-size: 40px; }
  .rueck-gross .rbox.ergebnis { padding: 14px 44px; }
  #changeArea { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }

  /* Pop-up: Geld auswählen */
  .popup-bg { position: fixed; inset: 0; background: rgba(13,43,78,.6); z-index: 20; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .popup { background: var(--bg); border: 3px solid var(--rand); border-radius: var(--rundung-gross); width: 100%; max-width: 1000px; max-height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  .popup-kopf { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 24px; background: var(--hellblau); color: var(--dunkelblau); }
  .popup-kopf h3 { margin: 0; font-size: var(--gr-3); font-weight: 700; }
  .popup-kopf .sum { font-size: var(--gr-1); text-align: right; line-height: 1.1; }
  .popup-kopf .sum b { display: block; font-size: var(--gr-4); font-weight: 700; }
  .popup-body { flex: 1; overflow-y: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
  .popup-fuss { display: flex; gap: 14px; padding: 14px 22px; background: var(--card); border-top: var(--rand-breite) solid var(--line); }
  .popup-fuss .gruen { margin-left: auto; }
  .vorrat-reihe button { position: relative; }
  .vorrat-reihe .cnt {
    position: absolute; top: -4px; right: -4px; min-width: 40px; height: 40px; padding: 0 10px; border-radius: 20px;
    background: var(--gruen); color: var(--dunkelblau); border: 2px solid var(--dunkelblau); font-weight: 700; font-size: var(--gr-1); line-height: 36px; text-align: center;
  }
  .btn { white-space: nowrap; }
  @media (max-width: 700px) { .btn.gross { font-size: var(--gr-2); padding: 0 20px; } .btn { font-size: var(--gr-1); padding: 0 18px; } .overlay .actions, .popup-fuss { flex-wrap: wrap; } .kosten b { font-size: 48px; } }

  /* ---------- Rückgeld ---------- */
  .done { align-items: stretch; }
  .done-body { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .rechnung { display: flex; align-items: stretch; justify-content: center; gap: 14px; flex-wrap: wrap; width: 100%; max-width: 900px; }
  .rechnung .zeichen { align-self: center; font-size: 48px; font-weight: 700; color: var(--muted); }
  .rbox { background: var(--card); border-radius: var(--rundung); padding: 12px 24px; text-align: center; border: 3px solid var(--line); min-width: 170px; }
  .rbox span { display: block; font-size: var(--gr-1); color: var(--muted); font-weight: 700; }
  .rbox b { font-size: 42px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rbox.ergebnis { background: var(--gruen); border-color: var(--gruen); }
  .rbox.ergebnis span, .rbox.ergebnis b { color: var(--dunkelblau); }
  .rbox.ergebnis b { font-size: 56px; }
  .rueck-titel { font-size: var(--gr-4); font-weight: 700; margin: 6px 0 0; text-align: center; }
  .rueck { display: flex; flex-wrap: wrap; gap: 22px; justify-content: center; max-width: 1000px; }
  .gruppe { background: var(--card); border-radius: var(--rundung-gross); padding: 16px 20px 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; border: 3px solid var(--line); }
  .gruppe .mal { font-weight: 700; font-size: 48px; color: var(--gut-text); line-height: 1; }
  .passend { background: var(--hellgruen); color: var(--dunkelblau); border-radius: var(--rundung-gross); padding: 26px 40px; font-weight: 700; font-size: 40px; display: flex; align-items: center; gap: 20px; text-align: center; }
  .passend svg { width: 64px; height: 64px; flex: none; }
  .done .actions, .done-actions { justify-content: center; }
  .done-actions .gruen { margin-left: 0 !important; }
  .done .actions .gruen { margin-left: 0; }

  /* ---------- Artikel-Verwaltung ---------- */
  #sArtikel { flex: 1; overflow-y: auto; padding: 18px; -webkit-overflow-scrolling: touch; }
  .list { display: flex; flex-direction: column; gap: 14px; max-width: 820px; margin: 18px auto 0; }
  .row { display: flex; align-items: center; gap: 16px; background: var(--card); border-radius: var(--rundung-gross); padding: 12px; border: 3px solid var(--line); }
  .row .th { width: 104px; height: 78px; border-radius: 12px; background: var(--flaeche-2) center/cover; flex: none; }
  .row .t { flex: 1; font-size: var(--gr-2); font-weight: 700; }
  .row .t small { display: block; color: var(--muted); font-weight: 400; font-size: var(--gr-1); }
  .row button { min-width: 52px; min-height: 52px; padding: 0 18px; border-radius: 14px; background: var(--card); color: var(--text); border: var(--rand-breite) solid var(--rand); font-size: var(--gr-1); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .row button.edit { background: var(--hellblau); border-color: var(--hellblau); color: var(--dunkelblau); }
  .toprow { max-width: 820px; margin: 0 auto; display: flex; }
  .form { max-width: 560px; margin: 0 auto; background: var(--card); border-radius: var(--rundung-gross); padding: 22px; display: flex; flex-direction: column; gap: 18px; border: 3px solid var(--line); }
  .form label { font-size: var(--gr-1); font-weight: 700; display: block; margin-bottom: 6px; }
  .form input[type=text] { width: 100%; font: inherit; font-size: var(--gr-3); padding: 12px; border: var(--rand-breite) solid var(--rand); border-radius: var(--rundung); -webkit-user-select: text; user-select: text; color: var(--text); background: var(--card); }
  .form .hinweis { font-size: 18px; color: var(--muted); margin-top: 4px; }
  .preview { width: 100%; aspect-ratio: 4/3; max-height: 34vh; border-radius: var(--rundung); background: var(--flaeche-2) center/cover no-repeat; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: var(--gr-1); text-align: center; padding: 10px; }
  .form .btns { display: flex; gap: 12px; flex-wrap: wrap; }
  .form .btns .gruen { margin-left: auto; }
  .form-body { flex: 1; overflow-y: auto; padding: 18px; }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-kaffee" viewBox="0 0 24 24"><path d="M4 9h12v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M16 10.5h1.5a2.5 2.5 0 0 1 0 5H16M8 3.5v2M12 3.5v2"/></symbol>
  <symbol id="i-pfeil-rechts" viewBox="0 0 24 24"><path d="M4.5 12h15M13 5.5 19.5 12 13 18.5"/></symbol>
  <symbol id="i-pfeil-links" viewBox="0 0 24 24"><path d="M19.5 12h-15M11 5.5 4.5 12l6.5 6.5"/></symbol>
  <symbol id="i-hoch" viewBox="0 0 24 24"><path d="M12 19.5v-15M5.5 11 12 4.5 18.5 11"/></symbol>
  <symbol id="i-runter" viewBox="0 0 24 24"><path d="M12 4.5v15M5.5 13 12 19.5 18.5 13"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>

        <path d="M22 80h156l14 70c1 6-3 12-9 12H17c-6 0-10-6-9-12z" fill="#fff"/>
        <g fill="#4DB2E6"><rect x="38" y="94" width="26" height="20" rx="5"/><rect x="74" y="94" width="26" height="20" rx="5"/><rect x="110" y="94" width="26" height="20" rx="5"/><rect x="146" y="94" width="20" height="20" rx="5"/>
        <rect x="38" y="124" width="26" height="20" rx="5"/><rect x="74" y="124" width="26" height="20" rx="5"/><rect x="110" y="124" width="26" height="20" rx="5"/></g>
        <rect x="146" y="124" width="20" height="20" rx="5" fill="#46A84A"/>

        <rect x="18" y="20" width="164" height="124" rx="14" fill="#fff"/>

        <circle cx="68" cy="64" r="13" fill="#F39200"/>
        <path d="M30 120l36-34 26 24 30-36 48 46v12H38z" fill="#46A84A"/>
        <circle cx="160" cy="146" r="30" fill="#4DB2E6"/>
        <path d="M160 130v32M144 146h32" stroke="#0D2B4E" stroke-width="9" stroke-linecap="round"/>

<!-- KASSE -->
<div id="sKasse" class="hidden">
  <main id="kasseMain"></main>
  <div id="bar">
    <div id="total"><small id="cnt">0 Sachen</small><span id="totalVal">0,00 €</span></div>
    <button class="btn" id="clearBtn">Neu anfangen</button>
    <button class="btn gruen gross" id="payBtn" disabled>Bezahlen<svg class="symbol" aria-hidden="true"><use href="#i-pfeil-rechts"/></svg></button>
  </div>
</div>

<!-- ARTIKEL -->
<div id="sArtikel" class="hidden"></div>

<div id="overlayHost"></div>

<script src="geld.js"></script>
<script>
(function () {
  'use strict';

  // ---------- Hilfsfunktionen ----------
  const fmt = c => (c / 100).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  // Geld (Cent). Bilder kommen aus geld.js (Spielgeld, wie im Kirmes-Kiosk).
  const SCHEINE = [5000, 2000, 1000, 500];
  const MUENZEN = [200, 100, 50, 20, 10];
  const ALLES = SCHEINE.concat(MUENZEN);
  const istSchein = v => v >= 500;
  const geldName = v => v >= 100 ? (v / 100) + ' Euro' : v + ' Cent';
  const geldBild = (v, scheinG, muenzG) => `<span class="geldbild" title="${geldName(v)}">${KirmesGeld.bild(v, istSchein(v) ? scheinG : muenzG)}</span>`;
  const ICON_HAKEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" fill="currentColor" stroke="none" opacity=".15"/><path d="M6.5 12.5l4 4 7-8"/></svg>';
  const ICON_BILD = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zm1 12h14l-4.5-6-3.5 4.5-2-2.5z"/></svg>';

  // ---------- Speicher ----------
  const KEY = 'cafe-kasse-artikel-v1';
  let items = [];
  try { items = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { items = []; }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); }
    catch (e) { alert('Der Speicher ist voll. Bitte einen Artikel löschen.'); }
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

  // ---------- Zustand ----------
  let cart = {};
  const cartTotal = () => items.reduce((s, it) => s + (cart[it.id] || 0) * it.price, 0);
  const cartCount = () => Object.values(cart).reduce((a, b) => a + b, 0);

  // ---------- Bildschirme ----------
  function show(name) {
    $('overlayHost').innerHTML = ''; document.querySelectorAll('.popup-bg').forEach(n => n.remove());
    $('sStart').classList.toggle('hidden', name !== 'start');
    $('sKasse').classList.toggle('hidden', name !== 'kasse');
    $('sArtikel').classList.toggle('hidden', name !== 'artikel');
    $('hdr').classList.toggle('hidden', name === 'start');
    $('hdrTitel').textContent = name === 'kasse' ? 'Kasse' : name === 'artikel' ? 'Artikel' : '';
    if (name === 'kasse') renderKasse();
    if (name === 'artikel') renderArtikel();
  }
  $('goKasse').onclick = () => show('kasse');
  $('goArtikel').onclick = () => show('artikel');
  $('homeBtn').onclick = () => show('start');

  // ---------- Kasse ----------
  function renderKasse() {
    const el = $('kasseMain');
    if (!items.length) {
      el.innerHTML = '<div class="empty">Es gibt noch keine Artikel.<br>Gehe zum <b>Start</b> und wähle <b>Artikel</b>.</div>';
    } else {
      el.innerHTML = '<div class="grid">' + items.map(it => {
        const q = cart[it.id] || 0;
        const bg = it.photo ? `style="background-image:url('${it.photo}')"` : '';
        return `<button class="tile ${q ? 'sel' : ''}" data-add="${it.id}">
          <div class="ph" ${bg}>${it.photo ? '' : ICON_BILD}</div>
          ${q ? `<div class="badge">${q}</div>` : ''}
          <div class="info"><div class="name">${esc(it.name)}</div><div class="price">${fmt(it.price)}</div></div>
          ${q ? `<span class="minus" data-sub="${it.id}"><svg class="symbol" aria-hidden="true"><use href="#i-minus"/></svg></span>` : ''}
        </button>`;
      }).join('') + '</div>';
    }
    updateBar();
  }
  function updateBar() {
    const n = cartCount();
    $('totalVal').textContent = fmt(cartTotal());
    $('cnt').textContent = n === 1 ? '1 Sache' : n + ' Sachen';
    $('payBtn').disabled = n === 0;
    $('clearBtn').disabled = n === 0;
  }
  $('kasseMain').addEventListener('click', e => {
    const sub = e.target.closest('[data-sub]');
    if (sub) {
      e.stopPropagation();
      const id = sub.dataset.sub;
      cart[id] = (cart[id] || 1) - 1; if (cart[id] <= 0) delete cart[id];
      renderKasse(); return;
    }
    const add = e.target.closest('[data-add]');
    if (add) { const id = add.dataset.add; cart[id] = (cart[id] || 0) + 1; renderKasse(); }
  });
  $('clearBtn').onclick = () => { if (confirm('Alles löschen und neu anfangen?')) { cart = {}; renderKasse(); } };
  $('payBtn').onclick = openPayment;

  // ---------- Bezahlen ----------
  function greedy(c) {
    const out = [];
    for (const v of ALLES) { let n = Math.floor(c / v); c -= n * v; while (n--) out.push(v); }
    if (c > 0) out.push(10);   // Rest unter 10 ct (nur bei ungewöhnlichen Preisen): eine 10-ct-Münze mehr
    return out;
  }

  function openPayment() {
    const total = cartTotal();
    let given = [], paid = false;
    const sum = () => given.reduce((a, b) => a + b, 0);
    const host = $('overlayHost');

    // jede gekaufte Sache einzeln: 2× Brötchen = 2 Fotos
    const cards = items.flatMap(it => Array.from({ length: cart[it.id] || 0 }, () => it)).map(it =>
      `<div class="bcard"><div class="bph" ${it.photo ? `style="background-image:url('${it.photo}')"` : ''}>${it.photo ? '' : ICON_BILD}</div>
       <div class="bname">${esc(it.name)}</div><div class="bprice">${fmt(it.price)}</div></div>`).join('');

    const minis = items.flatMap(it => Array.from({ length: cart[it.id] || 0 }, () => it)).map(it =>
      `<div class="mini" title="${esc(it.name)}" ${it.photo ? `style="background-image:url('${it.photo}')"` : ''}>${it.photo ? '' : ICON_BILD}</div>`).join('');

    host.innerHTML = `<div class="overlay">
      <div class="overlay-head">
        <button class="homebtn" id="pBack"><svg class="symbol" aria-hidden="true"><use href="#i-pfeil-links"/></svg>Zurück</button>
        <h2>Bezahlen</h2>
      </div>
      <div class="bill-body">
        <div class="bill-items" id="billItems">${cards}</div>
        <div class="bill-total"><span>Gesamt:</span><b>${fmt(total)}</b></div>
        <div id="changeArea"></div>
      </div>
      <div class="actions" id="pActions"><button class="btn blau gross" id="pAdd"><svg class="symbol" aria-hidden="true"><use href="#i-plus"/></svg>Geld wählen</button></div>
    </div>`;

    // Pop-up „Das Geld bezahlt der Kunde“
    function geldWaehlen() {
      const bg = document.createElement('div');
      bg.className = 'popup-bg';
      const knopf = v => `<button data-v="${v}" aria-label="${geldName(v)}">${geldBild(v, ...(window.innerWidth >= 900 ? [3.6, 4.6] : [3, 3.8]))}<span class="cnt hidden"></span></button>`;
      bg.innerHTML = `<div class="popup">
        <div class="popup-kopf"><h3>Das Geld bezahlt der Kunde</h3><div class="sum">Gegeben<b id="pSum"></b></div><button class="popup-x" id="pX" aria-label="Schließen"><svg class="symbol" aria-hidden="true"><use href="#i-schliessen"/></svg></button></div>
        <div class="popup-sub"><span>Es kostet <b>${fmt(total)}</b></span><span class="st" id="pSt"></span></div>
        <div class="popup-fotos">${minis}</div>
        <div class="popup-body">
          <div class="vorrat-reihe">${SCHEINE.map(knopf).join('')}</div>
          <div class="vorrat-reihe muenzen">${MUENZEN.map(knopf).join('')}</div>
        </div>
        <div class="popup-fuss">
          <button class="btn" id="pUndo"><svg class="symbol" aria-hidden="true"><use href="#i-zurueck"/></svg>Eins zurück</button>
          <button class="btn gelb" id="pExact">Genau passend</button>
          <button class="btn gruen gross" id="pClose">Fertig<svg class="symbol" aria-hidden="true"><use href="#i-haken"/></svg></button>
        </div>
      </div>`;
      document.body.appendChild(bg);
      const refresh = () => {
        const g = sum(), diff = g - total, st = $('pSt');
        $('pSum').textContent = fmt(g);
        bg.querySelectorAll('[data-v]').forEach(b => {
          const n = given.filter(v => v === +b.dataset.v).length, c = b.querySelector('.cnt');
          c.textContent = n; c.classList.toggle('hidden', !n);
        });
        $('pUndo').disabled = !given.length;
        if (!given.length) { st.className = 'st'; st.textContent = ''; }
        else if (diff < 0) { st.className = 'st fehlt'; st.textContent = `Es fehlen noch ${fmt(-diff)}`; }
        else { st.className = 'st genug'; st.innerHTML = '<svg class="symbol" aria-hidden="true"><use href="#i-haken"/></svg>Genug Geld!'; }
        $('pClose').disabled = !(given.length && diff >= 0);
      };
      bg.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { given.push(+b.dataset.v); refresh(); });
      $('pUndo').onclick = () => { given.pop(); refresh(); };
      $('pExact').onclick = () => { given = greedy(total); refresh(); };
      $('pX').onclick = () => bg.remove();
      $('pClose').onclick = () => { bg.remove(); zeigeRueckgeld(); };
      refresh();
    }

    // Nach Bestätigung: wieder die Kauf-Artikel, dazu das Rückgeld groß
    function zeigeRueckgeld() {
      paid = true;
      const g = sum(), change = g - total;
      const parts = []; let rest = change;
      for (const v of ALLES) { const n = Math.floor(rest / v); if (n) { parts.push({ v, n }); rest -= n * v; } }
      $('pBack').classList.add('hidden');
      $('billItems').classList.add('klein');
      $('changeArea').innerHTML = `
        <div class="rechnung rueck-gross">
          <div class="rbox"><span>Der Kunde gibt</span><b>${fmt(g)}</b></div>
          <div class="zeichen">−</div>
          <div class="rbox"><span>Es kostet</span><b>${fmt(total)}</b></div>
          <div class="zeichen">=</div>
          <div class="rbox ergebnis"><span>Rückgeld</span><b>${fmt(change)}</b></div>
        </div>
        ${change > 0
          ? `<h3 class="rueck-titel">Das bekommt der Kunde zurück:</h3>
             <div class="rueck">${parts.map(p => `<div class="gruppe">${geldBild(p.v, 2.8, 3.5)}<div class="mal">${p.n} ×</div></div>`).join('')}</div>`
          : `<div class="passend">${ICON_HAKEN}Genau passend!<br>Es gibt kein Rückgeld.</div>`}`;
      $('pActions').innerHTML = '<button class="btn gruen gross" id="next">Nächster Kunde<svg class="symbol" aria-hidden="true"><use href="#i-pfeil-rechts"/></svg></button>';
      $('pActions').classList.add('done-actions');
      $('next').onclick = () => { cart = {}; host.innerHTML = ''; renderKasse(); };
      $('billItems').parentNode.scrollTop = 0;
    }

    $('pBack').onclick = () => host.innerHTML = '';
    $('pAdd').onclick = geldWaehlen;
    geldWaehlen();   // Pop-up öffnet gleich
  }

  // ---------- Artikel-Verwaltung ----------
  function renderArtikel() {
    const el = $('sArtikel');
    el.innerHTML = `<div class="toprow"><button class="btn gruen gross" id="newItem"><svg class="symbol" aria-hidden="true"><use href="#i-plus"/></svg>Neuer Artikel</button></div>
    <div class="list">
      ${items.length ? items.map((it, i) => `<div class="row">
        <div class="th" ${it.photo ? `style="background-image:url('${it.photo}')"` : ''}></div>
        <div class="t">${esc(it.name)}<small>${fmt(it.price)}</small></div>
        <button data-up="${i}" ${i === 0 ? 'disabled' : ''} aria-label="nach oben"><svg class="symbol" aria-hidden="true"><use href="#i-hoch"/></svg></button>
        <button data-down="${i}" ${i === items.length - 1 ? 'disabled' : ''} aria-label="nach unten"><svg class="symbol" aria-hidden="true"><use href="#i-runter"/></svg></button>
        <button class="edit" data-edit="${it.id}">Ändern</button>
      </div>`).join('') : '<div class="empty">Noch keine Artikel.<br>Tippe auf <b>Neuer Artikel</b>.</div>'}
    </div>`;
    $('newItem').onclick = () => editItem(null);
  }
  $('sArtikel').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.edit) editItem(b.dataset.edit);
    const mv = (i, d) => { const j = i + d; if (j < 0 || j >= items.length) return; [items[i], items[j]] = [items[j], items[i]]; save(); renderArtikel(); };
    if (b.dataset.up) mv(+b.dataset.up, -1);
    if (b.dataset.down) mv(+b.dataset.down, 1);
  });

  // Preise nur in 10-Cent-Schritten (kleinste Münze im Spielgeld: 10 Cent)
  function parsePrice(s) {
    const n = parseFloat(String(s).replace('€', '').replace(',', '.').trim());
    if (!isFinite(n) || n < 0) return null;
    const c = Math.round(n * 100);
    return c % 10 === 0 ? c : null;
  }

  function resizePhoto(file) {
    return new Promise((res, rej) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const W = 480, H = 360, r = Math.max(W / img.width, H / img.height);
        const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
        const ctx = cv.getContext('2d'), w = img.width * r, h = img.height * r;
        ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
        URL.revokeObjectURL(url);
        res(cv.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = rej; img.src = url;
    });
  }

  function editItem(id) {
    const it = id ? items.find(x => x.id === id) : { id: uid(), name: '', price: 0, photo: '' };
    let photo = it.photo;
    const host = $('overlayHost');
    host.innerHTML = `<div class="overlay">
      <div class="overlay-head"><h2>${id ? 'Artikel ändern' : 'Neuer Artikel'}</h2></div>
      <div class="form-body"><div class="form">
        <div class="preview" id="prev" ${photo ? `style="background-image:url('${photo}')"` : ''}>${photo ? '' : 'Noch kein Foto'}</div>
        <input type="file" id="file" accept="image/*" class="hidden">
        <button class="btn blau" id="pick"><svg class="symbol" aria-hidden="true"><use href="#i-kamera"/></svg>Foto machen</button>
        <div><label>Name</label><input type="text" id="fName" value="${esc(it.name)}" placeholder="z. B. Käsebrötchen"></div>
        <div><label>Preis in Euro</label><input type="text" id="fPrice" inputmode="decimal" value="${it.name ? (it.price / 100).toFixed(2).replace('.', ',') : ''}" placeholder="z. B. 1,50">
          <div class="hinweis">Nur in 10-Cent-Schritten, z. B. 1,20 oder 1,50.</div></div>
        <div class="btns">
          ${id ? '<button class="btn" id="fDel">Löschen</button>' : ''}
          <button class="btn" id="fCancel">Abbrechen</button>
          <button class="btn gruen" id="fSave">Speichern</button>
        </div>
      </div></div></div>`;
    $('pick').onclick = () => $('file').click();
    $('file').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try { photo = await resizePhoto(f); const p = $('prev'); p.style.backgroundImage = `url('${photo}')`; p.textContent = ''; }
      catch (err) { alert('Das Foto konnte nicht geladen werden.'); }
    };
    $('fCancel').onclick = () => host.innerHTML = '';
    if (id) $('fDel').onclick = () => {
      if (!confirm('„' + it.name + '“ wirklich löschen?')) return;
      items = items.filter(x => x.id !== id); delete cart[id]; save(); host.innerHTML = ''; renderArtikel();
    };
    $('fSave').onclick = () => {
      const name = $('fName').value.trim(), price = parsePrice($('fPrice').value);
      if (!name) { alert('Bitte einen Namen eingeben.'); return; }
      if (price === null) { alert('Bitte einen Preis in 10-Cent-Schritten eingeben, z. B. 1,50'); return; }
      it.name = name; it.price = price; it.photo = photo;
      if (!id) items.push(it);
      save(); host.innerHTML = ''; renderArtikel();
    };
  }

  // ---------- Vollbild ----------
  const de = document.documentElement;
  const hatVollbild = !!(de.requestFullscreen || de.webkitRequestFullscreen);
  const schonApp = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const fsAn = () => document.fullscreenElement || document.webkitFullscreenElement;
  function fsSync() { document.body.classList.toggle('ist-vollbild', !!fsAn()); }
  function fsUmschalten() {
    try {
      if (fsAn()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else (de.requestFullscreen || de.webkitRequestFullscreen).call(de);
    } catch (e) {}
  }
  document.querySelectorAll('.fsbtn').forEach(b => {
    if (!hatVollbild || schonApp) b.classList.add('hidden');   // iPhone / schon als App installiert: kein Knopf nötig
    b.onclick = fsUmschalten;
  });
  document.addEventListener('fullscreenchange', fsSync);
  document.addEventListener('webkitfullscreenchange', fsSync);

  show('start');
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
