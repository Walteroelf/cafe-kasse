<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Café-Kasse">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbf7ee">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Café-Kasse</title>
<style>
  @font-face { font-family: "Andika"; font-weight: 400; font-display: swap; src: url("schriften/andika-400.woff2") format("woff2"); }
  @font-face { font-family: "Andika"; font-weight: 700; font-display: swap; src: url("schriften/andika-700.woff2") format("woff2"); }
  @font-face { font-family: "Grandstander"; font-weight: 700 900; font-display: swap; src: url("schriften/grandstander.woff2") format("woff2"); }

  :root {
    --bg: #fbf7ee; --card: #ffffff; --ink: #25343f; --muted: #6b7882; --line: #e3dccb;
    --blau: #2f8fd8; --blau-d: #1f6fb0; --blau-h: #dcedfb;
    --gruen: #2e9b4e; --gruen-d: #1f7a3a; --gruen-h: #dff3e4;
    --gelb: #ffd23f; --gelb-h: #fff3c4;
    --orange: #f39a1e; --orange-h: #fde9c9;
    --anzeige: "Grandstander", "Andika", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Andika", system-ui, sans-serif; font-size: 20px;
    background: var(--bg); color: var(--ink);
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
    display: flex; flex-direction: column; overflow: hidden;
    padding-top: env(safe-area-inset-top);
  }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  .hidden { display: none !important; }
  svg { display: block; }

  /* ---------- Kopfzeile ---------- */
  header {
    display: flex; align-items: center; gap: 16px; padding: 10px 16px;
    background: var(--card); border-bottom: 3px solid var(--line); min-height: 76px;
  }
  header h1 { font-family: var(--anzeige); font-size: 34px; margin: 0; }
  .homebtn {
    display: flex; align-items: center; gap: 10px; padding: 12px 22px 12px 16px; border-radius: 18px;
    background: var(--blau-h); color: var(--blau-d); font-family: var(--anzeige); font-weight: 800; font-size: 24px;
  }
  .homebtn:active { background: #c3def5; }

  /* ---------- Knöpfe ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    padding: 18px 30px; border-radius: 18px; font-family: var(--anzeige); font-size: 26px; font-weight: 800;
    background: #ece6d6; color: var(--ink);
  }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn.gruen { background: var(--gruen); color: #fff; }
  .btn.gruen:active:not(:disabled) { background: var(--gruen-d); }
  .btn.blau { background: var(--blau); color: #fff; }
  .btn.orange { background: var(--orange-h); color: #8a5300; }
  .btn.gross { font-size: 34px; padding: 24px 44px; border-radius: 22px; }

  /* ---------- Startbildschirm ---------- */
  #sStart { flex: 1; display: flex; flex-direction: column; padding: 22px; gap: 22px; overflow-y: auto; }
  .start-titel { text-align: center; font-family: var(--anzeige); font-size: clamp(34px, 5vw, 52px); font-weight: 900; margin: 6px 0 0; }
  .start-frage { text-align: center; font-size: 26px; color: var(--muted); margin: -10px 0 0; }
  .start-karten { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; min-height: 0; }
  .start-karte {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    border-radius: 32px; padding: 24px; text-align: center; box-shadow: 0 6px 0 rgba(0,0,0,.12);
  }
  .start-karte:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.12); }
  .start-karte svg { width: min(260px, 40vh); height: auto; }
  .start-karte b { font-family: var(--anzeige); font-size: clamp(38px, 5.5vw, 60px); font-weight: 900; line-height: 1.05; }
  .start-karte span { font-size: 24px; }
  .start-karte.kasse { background: var(--blau); color: #fff; }
  .start-karte.artikel { background: var(--gelb); color: var(--ink); }
  @media (max-width: 700px) { .start-karten { grid-template-columns: 1fr; } .start-karte svg { width: min(160px, 22vh); } }

  /* ---------- Kasse ---------- */
  #sKasse { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #kasseMain { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .tile {
    position: relative; background: var(--card); border-radius: 22px; overflow: hidden; display: block; width: 100%;
    box-shadow: 0 4px 0 var(--line); text-align: left; padding: 0; border: 4px solid transparent;
  }
  .tile:active { transform: scale(.97); }
  .tile .ph { width: 100%; aspect-ratio: 4/3; background: #efe9da center/cover no-repeat; display: flex; align-items: center; justify-content: center; color: #b9b19c; }
  .tile .ph svg { width: 56px; height: 56px; }
  .tile .info { padding: 10px 14px 14px; }
  .tile .name { font-weight: 700; font-size: 24px; line-height: 1.15; }
  .tile .price { display: inline-block; margin-top: 6px; background: var(--gelb-h); border-radius: 10px; padding: 2px 12px; font-family: var(--anzeige); font-weight: 800; font-size: 24px; }
  .tile.sel { border-color: var(--gruen); }
  .badge {
    position: absolute; top: 10px; right: 10px; min-width: 56px; height: 56px; padding: 0 14px; border-radius: 28px;
    background: var(--gruen); color: #fff; font-family: var(--anzeige); font-weight: 900; font-size: 32px;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,.35);
  }
  .minus {
    position: absolute; top: 10px; left: 10px; width: 56px; height: 56px; border-radius: 28px;
    background: #fff; color: var(--ink); font-family: var(--anzeige); font-size: 40px; font-weight: 900; line-height: 52px;
    text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,.35);
  }
  .empty { text-align: center; color: var(--muted); margin: 60px auto 0; font-size: 26px; line-height: 1.5; max-width: 520px; }
  #bar {
    display: flex; align-items: center; gap: 16px; padding: 14px 18px; padding-bottom: calc(14px + env(safe-area-inset-bottom));
    background: var(--card); border-top: 3px solid var(--line);
  }
  #total { margin-right: auto; font-family: var(--anzeige); font-weight: 900; font-size: 54px; font-variant-numeric: tabular-nums; line-height: 1; }
  #total small { display: block; font-family: "Andika", sans-serif; font-weight: 400; font-size: 20px; color: var(--muted); margin-bottom: 4px; }

  /* ---------- Overlay ---------- */
  .overlay { position: fixed; inset: 0; background: var(--bg); z-index: 10; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }
  .overlay-head { display: flex; align-items: center; gap: 18px; padding: 10px 16px; background: var(--card); border-bottom: 3px solid var(--line); min-height: 76px; }
  .overlay-head h2 { font-family: var(--anzeige); font-size: 34px; margin: 0; }
  .overlay .actions {
    display: flex; gap: 14px; padding: 14px 18px; padding-bottom: calc(14px + env(safe-area-inset-bottom));
    background: var(--card); border-top: 3px solid var(--line);
  }
  .overlay .actions .gruen { margin-left: auto; }

  /* ---------- Bezahlen ---------- */
  .pay-grid { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 18px; width: 100%; max-width: 960px; margin: 0 auto; }
  .kosten {
    background: var(--gelb); border-radius: 22px; padding: 14px 22px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  }
  .kosten span { font-size: 26px; font-weight: 700; }
  .kosten b { font-family: var(--anzeige); font-size: 64px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .teller {
    flex: 1; min-height: 0; background: var(--card); border: 4px dashed #cfc6ae; border-radius: 22px; padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .teller-t { font-size: 26px; font-weight: 700; color: var(--blau-d); }
  .teller-inhalt { flex: 1; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; align-items: center; }
  .teller-leer { color: var(--muted); font-size: 24px; padding: 14px 6px; }
  .teller-inhalt button { background: none; padding: 3px; border-radius: 12px; line-height: 0; }
  .teller-inhalt button:active { transform: scale(.92); opacity: .6; }
  .teller-hinweis { font-size: 18px; color: var(--muted); }
  .teller-summe { font-size: 26px; font-weight: 700; display: flex; justify-content: space-between; border-top: 3px solid var(--line); padding-top: 10px; }
  .teller-summe b { font-family: var(--anzeige); font-size: 36px; font-weight: 900; }
  .status { border-radius: 18px; padding: 14px 20px; font-family: var(--anzeige); font-weight: 800; font-size: 30px; display: flex; align-items: center; gap: 14px; min-height: 76px; }
  .status.fehlt { background: var(--orange-h); color: #8a5300; }
  .status.genug { background: var(--gruen-h); color: var(--gruen-d); }
  .status.leer { background: #efe9da; color: var(--muted); font-family: "Andika"; font-weight: 400; }
  .status svg { width: 38px; height: 38px; flex: none; }

  .vorrat-reihe { display: flex; flex-wrap: wrap; gap: 12px 14px; align-items: center; }
  .vorrat-reihe.muenzen { gap: 12px 18px; }
  .vorrat-reihe button { background: none; padding: 4px; border-radius: 14px; line-height: 0; }
  .vorrat-reihe button:active { transform: scale(.92); background: rgba(255,255,255,.7); }
  .vorrat-titel { font-size: 20px; color: var(--muted); margin: 0 0 -4px; font-weight: 700; }
  .geldbild svg { display: block; max-width: 100%; height: auto; }
  /* Pop-up: Geld auswählen */
  .popup-bg { position: fixed; inset: 0; background: rgba(37,52,63,.55); z-index: 20; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .popup { background: var(--bg); border-radius: 30px; width: 100%; max-width: 1000px; max-height: 100%; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  .popup-kopf { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 24px; background: var(--blau); color: #fff; }
  .popup-kopf h3 { margin: 0; font-family: var(--anzeige); font-size: 34px; font-weight: 900; }
  .popup-kopf .sum { font-size: 22px; text-align: right; line-height: 1.1; }
  .popup-kopf .sum b { display: block; font-family: var(--anzeige); font-size: 38px; font-weight: 900; }
  .popup-body { flex: 1; overflow-y: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
  .popup-fuss { display: flex; gap: 14px; padding: 14px 22px; background: var(--card); border-top: 3px solid var(--line); }
  .popup-fuss .gruen { margin-left: auto; }
  .vorrat-reihe button { position: relative; }
  .vorrat-reihe .cnt {
    position: absolute; top: -4px; right: -4px; min-width: 40px; height: 40px; padding: 0 10px; border-radius: 20px;
    background: var(--gruen); color: #fff; font-family: var(--anzeige); font-weight: 900; font-size: 24px; line-height: 40px; text-align: center;
    box-shadow: 0 2px 5px rgba(0,0,0,.35);
  }
  .btn { white-space: nowrap; }
  @media (max-width: 700px) { .btn.gross { font-size: 24px; padding: 18px 20px; } .btn { font-size: 22px; padding: 16px 18px; } .overlay .actions, .popup-fuss { flex-wrap: wrap; } .kosten b { font-size: 48px; } }

  /* ---------- Rückgeld ---------- */
  .done { align-items: stretch; }
  .done-body { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .rechnung { display: flex; align-items: stretch; justify-content: center; gap: 14px; flex-wrap: wrap; width: 100%; max-width: 900px; }
  .rechnung .zeichen { align-self: center; font-family: var(--anzeige); font-size: 48px; font-weight: 900; color: var(--muted); }
  .rbox { background: var(--card); border-radius: 18px; padding: 12px 24px; text-align: center; box-shadow: 0 4px 0 var(--line); min-width: 170px; }
  .rbox span { display: block; font-size: 22px; color: var(--muted); font-weight: 700; }
  .rbox b { font-family: var(--anzeige); font-size: 42px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .rbox.ergebnis { background: var(--gruen); box-shadow: 0 4px 0 var(--gruen-d); }
  .rbox.ergebnis span, .rbox.ergebnis b { color: #fff; }
  .rbox.ergebnis b { font-size: 56px; }
  .rueck-titel { font-family: var(--anzeige); font-size: 36px; font-weight: 900; margin: 6px 0 0; text-align: center; }
  .rueck { display: flex; flex-wrap: wrap; gap: 22px; justify-content: center; max-width: 1000px; }
  .gruppe { background: var(--card); border-radius: 22px; padding: 16px 20px 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 4px 0 var(--line); }
  .gruppe .mal { font-family: "Andika", sans-serif; font-weight: 700; font-size: 48px; color: var(--gruen-d); line-height: 1; }
  .passend { background: var(--gruen-h); color: var(--gruen-d); border-radius: 26px; padding: 26px 40px; font-family: var(--anzeige); font-weight: 900; font-size: 40px; display: flex; align-items: center; gap: 20px; text-align: center; }
  .passend svg { width: 64px; height: 64px; flex: none; }
  .done .actions { justify-content: center; }
  .done .actions .gruen { margin-left: 0; }

  /* ---------- Artikel-Verwaltung ---------- */
  #sArtikel { flex: 1; overflow-y: auto; padding: 18px; -webkit-overflow-scrolling: touch; }
  .list { display: flex; flex-direction: column; gap: 14px; max-width: 820px; margin: 18px auto 0; }
  .row { display: flex; align-items: center; gap: 16px; background: var(--card); border-radius: 20px; padding: 12px; box-shadow: 0 4px 0 var(--line); }
  .row .th { width: 104px; height: 78px; border-radius: 12px; background: #efe9da center/cover; flex: none; }
  .row .t { flex: 1; font-size: 26px; font-weight: 700; }
  .row .t small { display: block; color: var(--muted); font-weight: 400; font-size: 22px; }
  .row button { padding: 14px 18px; border-radius: 14px; background: #ece6d6; font-size: 22px; font-weight: 700; }
  .row button.edit { background: var(--blau-h); color: var(--blau-d); }
  .toprow { max-width: 820px; margin: 0 auto; display: flex; }
  .form { max-width: 560px; margin: 0 auto; background: var(--card); border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 18px; }
  .form label { font-size: 22px; font-weight: 700; display: block; margin-bottom: 6px; }
  .form input[type=text] { width: 100%; font: inherit; font-size: 28px; padding: 14px; border: 3px solid var(--line); border-radius: 14px; -webkit-user-select: text; user-select: text; color: var(--ink); background: #fff; }
  .form .hinweis { font-size: 18px; color: var(--muted); margin-top: 4px; }
  .preview { width: 100%; aspect-ratio: 4/3; max-height: 34vh; border-radius: 16px; background: #efe9da center/cover no-repeat; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 22px; text-align: center; padding: 10px; }
  .form .btns { display: flex; gap: 12px; flex-wrap: wrap; }
  .form .btns .gruen { margin-left: auto; }
  .form-body { flex: 1; overflow-y: auto; padding: 18px; }
</style>
</head>
<body>

<header id="hdr" class="hidden">
  <button class="homebtn" id="homeBtn" aria-label="Zum Startbildschirm">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg>Start
  </button>
  <h1 id="hdrTitel"></h1>
</header>

<!-- START -->
<div id="sStart">
  <h1 class="start-titel">☕ Schülercafé</h1>
  <p class="start-frage">Was möchtest du machen?</p>
  <div class="start-karten">
    <button class="start-karte kasse" id="goKasse">
      <svg viewBox="0 0 200 180" fill="none">
        <rect x="30" y="20" width="140" height="48" rx="10" fill="#fff"/>
        <rect x="42" y="30" width="116" height="28" rx="6" fill="#bfe1f7"/>
        <text x="152" y="52" text-anchor="end" font-family="Grandstander, sans-serif" font-weight="900" font-size="26" fill="#1f6fb0">3,50</text>
        <path d="M22 80h156l14 70c1 6-3 12-9 12H17c-6 0-10-6-9-12z" fill="#fff"/>
        <g fill="#2f8fd8"><rect x="38" y="94" width="26" height="20" rx="5"/><rect x="74" y="94" width="26" height="20" rx="5"/><rect x="110" y="94" width="26" height="20" rx="5"/><rect x="146" y="94" width="20" height="20" rx="5"/>
        <rect x="38" y="124" width="26" height="20" rx="5"/><rect x="74" y="124" width="26" height="20" rx="5"/><rect x="110" y="124" width="26" height="20" rx="5"/></g>
        <rect x="146" y="124" width="20" height="20" rx="5" fill="#2e9b4e"/>
      </svg>
      <b>Kasse</b><span>Bestellungen kassieren</span>
    </button>
    <button class="start-karte artikel" id="goArtikel">
      <svg viewBox="0 0 200 180" fill="none">
        <rect x="18" y="20" width="164" height="124" rx="14" fill="#fff"/>
        <rect x="30" y="32" width="140" height="100" rx="8" fill="#f6e7a6"/>
        <circle cx="68" cy="64" r="13" fill="#f39a1e"/>
        <path d="M30 120l36-34 26 24 30-36 48 46v12H38z" fill="#2e9b4e"/>
        <circle cx="160" cy="146" r="30" fill="#2f8fd8"/>
        <path d="M160 130v32M144 146h32" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
      </svg>
      <b>Artikel</b><span>Speisen und Getränke anlegen</span>
    </button>
  </div>
</div>

<!-- KASSE -->
<div id="sKasse" class="hidden">
  <main id="kasseMain"></main>
  <div id="bar">
    <div id="total"><small id="cnt">0 Sachen</small><span id="totalVal">0,00 €</span></div>
    <button class="btn" id="clearBtn">Neu anfangen</button>
    <button class="btn gruen gross" id="payBtn" disabled>Bezahlen ➜</button>
  </div>
</div>

<!-- ARTIKEL -->
<div id="sArtikel" class="hidden"></div>

<div id="overlayHost"></div>

<script src="geld.js"></script>
<script>
(function () {
  'use strict';

  // ---------- Hilfsfunktionen ----------
  const fmt = c => (c / 100).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  // Geld (Cent). Bilder kommen aus geld.js (Spielgeld, wie im Kirmes-Kiosk).
  const SCHEINE = [5000, 2000, 1000, 500];
  const MUENZEN = [200, 100, 50, 20, 10];
  const ALLES = SCHEINE.concat(MUENZEN);
  const istSchein = v => v >= 500;
  const geldName = v => v >= 100 ? (v / 100) + ' Euro' : v + ' Cent';
  const geldBild = (v, scheinG, muenzG) => `<span class="geldbild" title="${geldName(v)}">${KirmesGeld.bild(v, istSchein(v) ? scheinG : muenzG)}</span>`;
  const ICON_HAKEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" fill="currentColor" stroke="none" opacity=".15"/><path d="M6.5 12.5l4 4 7-8"/></svg>';
  const ICON_BILD = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zm1 12h14l-4.5-6-3.5 4.5-2-2.5z"/></svg>';

  // ---------- Speicher ----------
  const KEY = 'cafe-kasse-artikel-v1';
  let items = [];
  try { items = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { items = []; }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); }
    catch (e) { alert('Der Speicher ist voll. Bitte einen Artikel löschen.'); }
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

  // ---------- Zustand ----------
  let cart = {};
  const cartTotal = () => items.reduce((s, it) => s + (cart[it.id] || 0) * it.price, 0);
  const cartCount = () => Object.values(cart).reduce((a, b) => a + b, 0);

  // ---------- Bildschirme ----------
  function show(name) {
    $('overlayHost').innerHTML = ''; document.querySelectorAll('.popup-bg').forEach(n => n.remove());
    $('sStart').classList.toggle('hidden', name !== 'start');
    $('sKasse').classList.toggle('hidden', name !== 'kasse');
    $('sArtikel').classList.toggle('hidden', name !== 'artikel');
    $('hdr').classList.toggle('hidden', name === 'start');
    $('hdrTitel').textContent = name === 'kasse' ? 'Kasse' : name === 'artikel' ? 'Artikel' : '';
    if (name === 'kasse') renderKasse();
    if (name === 'artikel') renderArtikel();
  }
  $('goKasse').onclick = () => show('kasse');
  $('goArtikel').onclick = () => show('artikel');
  $('homeBtn').onclick = () => show('start');

  // ---------- Kasse ----------
  function renderKasse() {
    const el = $('kasseMain');
    if (!items.length) {
      el.innerHTML = '<div class="empty">Es gibt noch keine Artikel.<br>Gehe zum <b>Start</b> und wähle <b>Artikel</b>.</div>';
    } else {
      el.innerHTML = '<div class="grid">' + items.map(it => {
        const q = cart[it.id] || 0;
        const bg = it.photo ? `style="background-image:url('${it.photo}')"` : '';
        return `<button class="tile ${q ? 'sel' : ''}" data-add="${it.id}">
          <div class="ph" ${bg}>${it.photo ? '' : ICON_BILD}</div>
          ${q ? `<div class="badge">${q}</div>` : ''}
          <div class="info"><div class="name">${esc(it.name)}</div><div class="price">${fmt(it.price)}</div></div>
          ${q ? `<span class="minus" data-sub="${it.id}">−</span>` : ''}
        </button>`;
      }).join('') + '</div>';
    }
    updateBar();
  }
  function updateBar() {
    const n = cartCount();
    $('totalVal').textContent = fmt(cartTotal());
    $('cnt').textContent = n === 1 ? '1 Sache' : n + ' Sachen';
    $('payBtn').disabled = n === 0;
    $('clearBtn').disabled = n === 0;
  }
  $('kasseMain').addEventListener('click', e => {
    const sub = e.target.closest('[data-sub]');
    if (sub) {
      e.stopPropagation();
      const id = sub.dataset.sub;
      cart[id] = (cart[id] || 1) - 1; if (cart[id] <= 0) delete cart[id];
      renderKasse(); return;
    }
    const add = e.target.closest('[data-add]');
    if (add) { const id = add.dataset.add; cart[id] = (cart[id] || 0) + 1; renderKasse(); }
  });
  $('clearBtn').onclick = () => { if (confirm('Alles löschen und neu anfangen?')) { cart = {}; renderKasse(); } };
  $('payBtn').onclick = openPayment;

  // ---------- Bezahlen ----------
  function greedy(c) {
    const out = [];
    for (const v of ALLES) { let n = Math.floor(c / v); c -= n * v; while (n--) out.push(v); }
    if (c > 0) out.push(10);   // Rest unter 10 ct (nur bei ungewöhnlichen Preisen): eine 10-ct-Münze mehr
    return out;
  }

  function openPayment() {
    const total = cartTotal();
    let given = [];
    const sum = () => given.reduce((a, b) => a + b, 0);
    const host = $('overlayHost');

    host.innerHTML = `<div class="overlay">
      <div class="overlay-head">
        <button class="homebtn" id="pBack"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>Zurück</button>
        <h2>Bezahlen</h2>
      </div>
      <div class="pay-grid">
        <div class="kosten"><span>Das kostet:</span><b>${fmt(total)}</b></div>
        <div class="teller">
          <div class="teller-t">Das gibt der Kunde:</div>
          <div class="teller-inhalt" id="tInhalt"></div>
          <div class="teller-hinweis" id="tHinweis">Tippe aufs Geld, um es wieder wegzunehmen.</div>
          <div class="teller-summe"><span>Zusammen:</span><b id="tSumme"></b></div>
        </div>
        <div class="status" id="tStatus"></div>
      </div>
      <div class="actions">
        <button class="btn orange" id="pExact">Genau passend</button>
        <button class="btn blau gross" id="pAdd">＋ Geld wählen</button>
        <button class="btn gruen gross" id="pOk">Fertig ➜</button>
      </div>
    </div>`;

    function update() {
      const g = sum(), diff = g - total;
      const sorted = given.slice().sort((a, b) => b - a);
      $('tInhalt').innerHTML = sorted.length
        ? sorted.map(v => `<button data-weg="${v}" aria-label="${geldName(v)} wegnehmen">${geldBild(v, 2.3, 3)}</button>`).join('')
        : '<div class="teller-leer">Noch nichts. Tippe auf <b>Geld wählen</b>.</div>';
      $('tHinweis').classList.toggle('hidden', !given.length);
      $('tSumme').textContent = fmt(g);
      const st = $('tStatus');
      if (!given.length) { st.className = 'status leer'; st.textContent = 'Wie viel Geld gibt der Kunde?'; }
      else if (diff < 0) { st.className = 'status fehlt'; st.innerHTML = `Es fehlen noch ${fmt(-diff)}`; }
      else { st.className = 'status genug'; st.innerHTML = ICON_HAKEN + 'Das ist genug Geld!'; }
      $('pOk').disabled = !(given.length && diff >= 0);
    }

    // Pop-up: nur das Geld, groß
    function geldWaehlen() {
      const bg = document.createElement('div');
      bg.className = 'popup-bg';
      const knopf = v => `<button data-v="${v}" aria-label="${geldName(v)}">${geldBild(v, ...(window.innerWidth >= 900 ? [3.6, 4.6] : [3, 3.8]))}<span class="cnt hidden"></span></button>`;
      bg.innerHTML = `<div class="popup">
        <div class="popup-kopf"><h3>Tippe auf das Geld</h3><div class="sum">Gegeben<b id="pSum"></b></div></div>
        <div class="popup-body">
          <div class="vorrat-reihe">${SCHEINE.map(knopf).join('')}</div>
          <div class="vorrat-reihe muenzen">${MUENZEN.map(knopf).join('')}</div>
        </div>
        <div class="popup-fuss">
          <button class="btn" id="pUndo">↶ Eins zurück</button>
          <button class="btn gruen gross" id="pClose">Fertig ✓</button>
        </div>
      </div>`;
      document.body.appendChild(bg);
      const refresh = () => {
        $('pSum').textContent = fmt(sum());
        bg.querySelectorAll('[data-v]').forEach(b => {
          const n = given.filter(v => v === +b.dataset.v).length, c = b.querySelector('.cnt');
          c.textContent = n; c.classList.toggle('hidden', !n);
        });
        $('pUndo').disabled = !given.length;
      };
      bg.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { given.push(+b.dataset.v); refresh(); update(); });
      $('pUndo').onclick = () => { given.pop(); refresh(); update(); };
      $('pClose').onclick = () => bg.remove();
      refresh();
    }

    $('tInhalt').onclick = e => {
      const b = e.target.closest('[data-weg]');
      if (b) { const i = given.indexOf(+b.dataset.weg); if (i >= 0) given.splice(i, 1); update(); }
      else if (!given.length) geldWaehlen();
    };
    $('pBack').onclick = () => host.innerHTML = '';
    $('pAdd').onclick = geldWaehlen;
    $('pExact').onclick = () => { given = greedy(total); update(); };
    $('pOk').onclick = () => showChange(sum(), total);
    update();
  }

  // ---------- Rückgeld ----------
  function showChange(g, total) {
    const change = g - total;
    const parts = []; let rest = change;
    for (const v of ALLES) { const n = Math.floor(rest / v); if (n) { parts.push({ v, n }); rest -= n * v; } }
    $('overlayHost').innerHTML = `<div class="overlay done">
      <div class="overlay-head"><h2>Rückgeld</h2></div>
      <div class="done-body">
        <div class="rechnung">
          <div class="rbox"><span>Der Kunde gibt</span><b>${fmt(g)}</b></div>
          <div class="zeichen">−</div>
          <div class="rbox"><span>Es kostet</span><b>${fmt(total)}</b></div>
          <div class="zeichen">=</div>
          <div class="rbox ergebnis"><span>Rückgeld</span><b>${fmt(change)}</b></div>
        </div>
        ${change > 0
          ? `<h3 class="rueck-titel">Das bekommt der Kunde zurück:</h3>
             <div class="rueck">${parts.map(p => `<div class="gruppe">${geldBild(p.v, 3, 3.8)}<div class="mal">${p.n} ×</div></div>`).join('')}</div>`
          : `<div class="passend">${ICON_HAKEN}Genau passend!<br>Es gibt kein Rückgeld.</div>`}
      </div>
      <div class="actions"><button class="btn gruen gross" id="next">Nächster Kunde ➜</button></div>
    </div>`;
    $('next').onclick = () => { cart = {}; $('overlayHost').innerHTML = ''; renderKasse(); };
  }

  // ---------- Artikel-Verwaltung ----------
  function renderArtikel() {
    const el = $('sArtikel');
    el.innerHTML = `<div class="toprow"><button class="btn gruen gross" id="newItem">＋ Neuer Artikel</button></div>
    <div class="list">
      ${items.length ? items.map((it, i) => `<div class="row">
        <div class="th" ${it.photo ? `style="background-image:url('${it.photo}')"` : ''}></div>
        <div class="t">${esc(it.name)}<small>${fmt(it.price)}</small></div>
        <button data-up="${i}" ${i === 0 ? 'disabled' : ''} aria-label="nach oben">↑</button>
        <button data-down="${i}" ${i === items.length - 1 ? 'disabled' : ''} aria-label="nach unten">↓</button>
        <button class="edit" data-edit="${it.id}">Ändern</button>
      </div>`).join('') : '<div class="empty">Noch keine Artikel.<br>Tippe auf <b>Neuer Artikel</b>.</div>'}
    </div>`;
    $('newItem').onclick = () => editItem(null);
  }
  $('sArtikel').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.edit) editItem(b.dataset.edit);
    const mv = (i, d) => { const j = i + d; if (j < 0 || j >= items.length) return; [items[i], items[j]] = [items[j], items[i]]; save(); renderArtikel(); };
    if (b.dataset.up) mv(+b.dataset.up, -1);
    if (b.dataset.down) mv(+b.dataset.down, 1);
  });

  // Preise nur in 10-Cent-Schritten (kleinste Münze im Spielgeld: 10 Cent)
  function parsePrice(s) {
    const n = parseFloat(String(s).replace('€', '').replace(',', '.').trim());
    if (!isFinite(n) || n < 0) return null;
    const c = Math.round(n * 100);
    return c % 10 === 0 ? c : null;
  }

  function resizePhoto(file) {
    return new Promise((res, rej) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const W = 480, H = 360, r = Math.max(W / img.width, H / img.height);
        const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
        const ctx = cv.getContext('2d'), w = img.width * r, h = img.height * r;
        ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
        URL.revokeObjectURL(url);
        res(cv.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = rej; img.src = url;
    });
  }

  function editItem(id) {
    const it = id ? items.find(x => x.id === id) : { id: uid(), name: '', price: 0, photo: '' };
    let photo = it.photo;
    const host = $('overlayHost');
    host.innerHTML = `<div class="overlay">
      <div class="overlay-head"><h2>${id ? 'Artikel ändern' : 'Neuer Artikel'}</h2></div>
      <div class="form-body"><div class="form">
        <div class="preview" id="prev" ${photo ? `style="background-image:url('${photo}')"` : ''}>${photo ? '' : 'Noch kein Foto'}</div>
        <input type="file" id="file" accept="image/*" class="hidden">
        <button class="btn blau" id="pick">📷 Foto machen</button>
        <div><label>Name</label><input type="text" id="fName" value="${esc(it.name)}" placeholder="z. B. Käsebrötchen"></div>
        <div><label>Preis in Euro</label><input type="text" id="fPrice" inputmode="decimal" value="${it.name ? (it.price / 100).toFixed(2).replace('.', ',') : ''}" placeholder="z. B. 1,50">
          <div class="hinweis">Nur in 10-Cent-Schritten, z. B. 1,20 oder 1,50.</div></div>
        <div class="btns">
          ${id ? '<button class="btn" id="fDel">Löschen</button>' : ''}
          <button class="btn" id="fCancel">Abbrechen</button>
          <button class="btn gruen" id="fSave">Speichern</button>
        </div>
      </div></div></div>`;
    $('pick').onclick = () => $('file').click();
    $('file').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try { photo = await resizePhoto(f); const p = $('prev'); p.style.backgroundImage = `url('${photo}')`; p.textContent = ''; }
      catch (err) { alert('Das Foto konnte nicht geladen werden.'); }
    };
    $('fCancel').onclick = () => host.innerHTML = '';
    if (id) $('fDel').onclick = () => {
      if (!confirm('„' + it.name + '“ wirklich löschen?')) return;
      items = items.filter(x => x.id !== id); delete cart[id]; save(); host.innerHTML = ''; renderArtikel();
    };
    $('fSave').onclick = () => {
      const name = $('fName').value.trim(), price = parsePrice($('fPrice').value);
      if (!name) { alert('Bitte einen Namen eingeben.'); return; }
      if (price === null) { alert('Bitte einen Preis in 10-Cent-Schritten eingeben, z. B. 1,50'); return; }
      it.name = name; it.price = price; it.photo = photo;
      if (!id) items.push(it);
      save(); host.innerHTML = ''; renderArtikel();
    };
  }

  show('start');
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
